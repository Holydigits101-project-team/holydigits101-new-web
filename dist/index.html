ITS101 Global. She is committed to empowering young people through education, technology, and digital innovation. Through her leadership at HOLYDIGITS101 Global, she develops programs and initiatives that help students, educators, and young professionals gain the skills needed to succeed in the digital age. With expertise in education, product management, project coordination, communications, and digital media, she focuses on building impactful learning communities that foster innovation, leadership, and personal growth.",social:{label:"LinkedIn",url:"https://www.linkedin.com/in/dorcas-olaoye-606a41254?utm_source=share_via&utm_content=profile&utm_medium=member_android",display:""},image:"https://storage.lingoql.com/holydigits101/cofounder.PNG",imageClass:"h-[485px]"},{name:"Edu Confidence Edwin",role:"CEO",category:"Founders",summary:"Leads executive coordination, organizational growth, and operational alignment for HolyDigits101 Global.",fullBio:"Edu Confidence Edwin serves as CEO of HolyDigits101 Global, supporting the organization through executive leadership, growth coordination, and operational direction. His work helps align people, programs, reporting, and strategic delivery so the movement can scale with clarity, accountability, and global impact.",image:"https://storage.lingoql.com/holydigits101/confidence.PNG",imageClass:"h-[410px]"},{name:"Virginia Schmidt",role:"Operative Board",category:"Founders",summary:"Virginia Schmidt stands at the intersection of innovation, creativity, and impact. Founder Xini8. She spearheads a decentralized movement redefining how people leverage social capital through blockchain and Web3 technology.",fullBio:"Virginia Schmidt stands at the intersection of innovation, creativity, and impact. Founder Xini8. She spearheads a decentralized movement redefining how people leverage social capital through blockchain and Web3 technology.Known in global circles as a “business punk,” Virginia embodies a bold, disruptive energy—challenging outdated systems and inspiring a new generation of thinkers, builders, and dreamers to take ownership of their digital and economic futures. Her work bridges traditional business excellence with decentralized innovation, positioning her as a true connector within the Web3 ecosystem. From shaping crypto and blockchain initiatives to curating virtual and real-world experiences, Virginia is constantly pushing boundaries. Virginia Schmidt is not just leading conversations—she’s architecting the future of decentralized empowerment",image:"https://res.cloudinary.com/dvjiszahi/image/upload/v1780910676/PHOTO-2025-06-22-19-51-36_koegis.jpg",imageClass:"h-[410px]"},{name:"Akinlolu Blessing",role:"HOD, Education & Curriculum",category:"Departmental Heads",summary:"Shapes learner-centered curriculum for digital literacy, Web3 understanding, and practical problem-solving.",fullBio:"Akinlolu Blessing leads Education & Curriculum with a focus on accessible learning design, educator support, and practical digital skills. The work centers on helping learners understand technology with confidence while connecting lessons to real opportunities in a changing global economy.",image:"https://images.pexels.com/photos/5905753/pexels-photo-5905753.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=900",imageClass:"h-[395px]"},{name:"Odey Divine",role:"HOD, Research & Development",category:"Departmental Heads",summary:"Turns research, field insight, and emerging technology trends into stronger learning experiences.",fullBio:"Odey Divine leads Research & Development by studying educational gaps, testing new ideas, and translating insight into programs that are useful, ethical, and scalable. This role helps HolyDigits101 stay responsive as Web3, AI, and digital education evolve.",image:"https://images.pexels.com/photos/5816287/pexels-photo-5816287.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=900",imageClass:"h-[350px]"},{name:"Prosper James",role:"Programs Officer / Community Engagement",c
