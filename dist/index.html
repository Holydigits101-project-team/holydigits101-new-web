tion, communications, and digital media, she focuses on building impactful learning communities that foster innovation, leadership, and personal growth.",social:{label:"LinkedIn",url:"https://www.linkedin.com/in/dorcas-olaoye-606a41254?utm_source=share_via&utm_content=profile&utm_medium=member_android",display:""},image:"https://storage.lingoql.com/holydigits101/cofounder.PNG",imageClass:"h-[485px]"},{name:"Edu Confidence Edwin",role:"CEO",category:"Founders",summary:"Leads executive coordination, organizational growth, and operational alignment for HolyDigits101 Global.",fullBio:"Edu Confidence Edwin serves as CEO of HolyDigits101 Global, supporting the organization through executive leadership, growth coordination, and operational direction. His work helps align people, programs, reporting, and strategic delivery so the movement can scale with clarity, accountability, and global impact.",image:"https://storage.lingoql.com/holydigits101/confidence.PNG",imageClass:"h-[410px]"},{name:"Virginia Schmidt",role:"Operative Board",category:"Founders",summary:"Virginia Schmidt stands at the intersection of innovation, creativity, and impact. Founder Xini8. She spearheads a decentralized movement redefining how people leverage social capital through blockchain and Web3 technology.",fullBio:"Virginia Schmidt stands at the intersection of innovation, creativity, and impact. Founder Xini8. She spearheads a decentralized movement redefining how people leverage social capital through blockchain and Web3 technology.Known in global circles as a “business punk,” Virginia embodies a bold, disruptive energy—challenging outdated systems and inspiring a new generation of thinkers, builders, and dreamers to take ownership of their digital and economic futures. Her work bridges traditional business excellence with decentralized innovation, positioning her as a true connector within the Web3 ecosystem. From shaping crypto and blockchain initiatives to curating virtual and real-world experiences, Virginia is constantly pushing boundaries. Virginia Schmidt is not just leading conversations—she’s architecting the future of decentralized empowerment",image:"https://res.cloudinary.com/dvjiszahi/image/upload/v1780910676/PHOTO-2025-06-22-19-51-36_koegis.jpg",imageClass:"h-[410px]"},{name:"Akinlolu Blessing",role:"HOD, Education & Curriculum",category:"Departmental Heads",summary:"Shapes learner-centered curriculum for digital literacy, Web3 understanding, and practical problem-solving.",fullBio:"Akinlolu Blessing leads Education & Curriculum with a focus on accessible learning design, educator support, and practical digital skills. The work centers on helping learners understand technology with confidence while connecting lessons to real opportunities in a changing global economy.",image:"https://images.pexels.com/photos/5905753/pexels-photo-5905753.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=900",imageClass:"h-[395px]"},{name:"Odey Divine",role:"HOD, Research & Development",category:"Departmental Heads",summary:"Turns research, field insight, and emerging technology trends into stronger learning experiences.",fullBio:"Odey Divine leads Research & Development by studying educational gaps, testing new ideas, and translating insight into programs that are useful, ethical, and scalable. This role helps HolyDigits101 stay responsive as Web3, AI, and digital education evolve.",image:"https://images.pexels.com/photos/5816287/pexels-photo-5816287.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=900",imageClass:"h-[350px]"},{name:"Prosper James",role:"Programs Officer / Community Engagement",category:"Departmental Heads",summary:"Connects programs with real communities so learning feels practical, human, and locally meaningful.",fullBio:"Prosper James supports Programs and Community Engagement by coordinating outreach, learner participation, and community relationships. This work keeps the mission grounded in real needs while helping people access the skills, mindset, and support required for digital opportunity.",image:"https://images.pexels.com/photos/7870288/pexels-photo-7870288.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=900",imageClass:"h-[455px]"},{name:"Olutimehin Toluwani Honour",role:"HOD, Media & Communications",category:"Departmental Heads",summary:"Leads storytelling, communications, and digital presence with clarity, dignity, and purpose.",fullBio:"Olutimehin Toluwani Honour leads Media & Communications, shaping how the HolyDigits101 story is shared across platforms. The role focuses on clear messaging, community trust, campaign coordination, and media that reflects the organization's values of education, access, innovation, and service.",image:"https://images.pexels.com/photos/16306778/pexels-photo-16306778.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=900",imageClass:"h-[405px]"},{name:"Jimin",role:"Technical / IT Lead",category:"Departmental Heads",summary:"Supports the technical systems, digital tools, and infrastructure behind decentralized learning access.",fullBio:"Jimin supports Technical / IT operations for HolyDigits101, helping the organization maintain reliable systems, digital tools, and technical workflows. This role strengthens the foundation needed to deliver Web3 education, community programs, and future platform experiences at scale.",social:{label:"LinkedIn",url:"https://www.linkedin.com/in/dorcas-olaoye-606a41254?utm_source=share_via&utm_content=profile&utm_medium=member_android",display:""},image:"https://images.pexels.com/photos/8091254/pexels-photo-8091254.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=900",imageClass:"h-[470px]"},{name:"Edu Confidence Edwin",role:"Support Units, M&E / Administration & Reporting",category:"Departmental Heads",summary:"Oversees monitoring, evaluation, administration, and reporting systems that keep the mission accountable.",fullBio:"Edu Confidence Edwin also leads the Support Units for Monitoring & Evaluation (M&E), Administration, and Reporting. This role strengthens internal accountability, program documentation, operational follow-through, and the reporting structure needed to measure impact across HolyDigits101 initiatives.",image:"https://res.cloudinary.com/dvjiszahi/image/upload/v1780913543/4B67536D-3868-4551-8E48-38FC8A663DF2_wfxnai.png",imageClass:"h-[385px]"},{name:"Daniel Okon",role:"Cheif Traning Officer",category:"Departmental Heads",summary:"Daniel Okon is the Chief Traning Officer of HolyDigits101 Africa, where he drives organisational growth, trains executive members, and coordinates strategic partnership proposals for one of Africa's emerging Web3 and blockchain education initiatives.",fullBio:"Daniel Okon is the Chief Technology Officer of HolyDigits101 Africa, where he drives organisational growth, trains executive members, and coordinates strategic partnership proposals for one of Africa's emerging Web3 and blockchain education initiatives.  A PMP-certified Project Manager with over five years of cross-industry experience, Daniel combines executive leadership with deep operational expertise across the tech, industrial, food service, and public relations sectors. Holding a Bachelor of Science in Political Science and Public Administration from the University of Benin, Daniel has consistently operated at both strategic and ground levels — from designing safety compliance programs for 50+ workers at Yongxin Iron & Steel, to managing revenue pipelines and technical teams at Havilah Tech, to delivering strategic business recommendations as a Consultant at ChilTech. Notable among his achievements is a 40% increase in daily profit and 30% increase in monthly profit delivered during his supervisory role at Yummies by Igho — a testament to his results-driven approach to business and people management. Beyond his professional engagements, Daniel is a recognised alumnus of the Young African Leadership Initiative (YALI) and an active member of Junior Chambers International (JCI) and Man O' War — r           50% { background-position: 100% 50%; }
        }

        @keyframes particleFloat {
          0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.32; }
          50% { transform: translate3d(20px, -34px, 0); opacity: 0.9; }
        }

        @keyframes pulseGlow {
          0%, 100% { box-shadow: 0 0 0 0 rgba(244, 180, 0, 0.34), 0 24px 70px rgba(212, 160, 23, 0.24); }
          50% { box-shadow: 0 0 0 16px rgba(244, 180, 0, 0), 0 28px 90px rgba(244, 180, 0, 0.34); }
        }

        .motion-drift { animation: heroDrift 18s ease-in-out infinite; }
        .gradient-text {
          background: linear-gradient(110deg, #ffffff 0%, #F4B400 28%, #D4A017 54%, #fff3c4 78%, #ffffff 100%);
          background-size: 230% 230%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          animation: gradientShift 7s ease-in-out infinite;
        }
        .particle { animation: particleFloat var(--duration) ease-in-out infinite; animation-delay: var(--delay); }
        .pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }
        .reveal { opacity: 0; transform: translateY(34px); transition: opacity 0.9s cubic-bezier(.16,1,.3,1), transform 0.9s cubic-bezier(.16,1,.3,1); transition-delay: var(--delay, 0ms); }
        .reveal.is-visible { opacity: 1; transform: translateY(0); }
        .tech-grid { background-image: linear-gradient(rgba(244,180,0,0.075) 1px, transparent 1px), linear-gradient(90deg, rgba(244,180,0,0.075) 1px, transparent 1px); background-size: 72px 72px; mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 68%); }
        .gold-ring { border: 1px solid rgba(244,180,0,0.2); box-shadow: inset 0 0 44px rgba(244,180,0,0.06), 0 0 80px rgba(212,160,23,0.12); }

        @media (prefers-reduced-motion: reduce) {
          .motion-drift, .gradient-text, .particle, .pulse-glow { animation: none !important; }
          .reveal { opacity: 1; transform: none; transition: none; }
        }
